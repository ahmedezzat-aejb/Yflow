<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yflow - Cyber Dashboard Demo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            width: 100%;
            margin: 0;
            padding: 0;
            background: #05070a;
            overflow: hidden;
        }

        body {
            font-family: 'Orbitron', monospace;
            color: #e0e0e0;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: rgba(13, 26, 33, 0.9);
            border-bottom: 2px solid #00f3ff;
            padding: 20px;
            text-align: center;
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.3);
        }

        .logo {
            font-size: 3rem;
            font-weight: 900;
            letter-spacing: 8px;
            margin-bottom: 10px;
            animation: glitch 2s infinite;
        }

        .logo span {
            color: #00f3ff;
            text-shadow: 0 0 20px #00f3ff;
        }

        .subtitle {
            font-size: 1.2rem;
            color: #39ff14;
            margin-bottom: 20px;
        }

        .language-selector {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .lang-btn {
            padding: 8px 16px;
            background: rgba(0, 243, 255, 0.1);
            border: 1px solid #00f3ff;
            color: #00f3ff;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Orbitron', monospace;
        }

        .lang-btn:hover, .lang-btn.active {
            background: #00f3ff;
            color: #05070a;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.5);
        }

        .trial-info {
            margin-top: 20px;
            text-align: center;
            animation: pulse 2s infinite;
        }

        .trial-badge {
            display: inline-block;
            background: linear-gradient(45deg, #39ff14, #00f3ff);
            color: #05070a;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 900;
            font-size: 0.9rem;
            margin-bottom: 8px;
            box-shadow: 0 0 20px rgba(57, 255, 20, 0.4);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .trial-badge:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 25px rgba(57, 255, 20, 0.6);
        }

        .trial-desc {
            color: #888;
            font-size: 0.8rem;
        }

        .main-content {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
        }

        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 25px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .project-card {
            background: rgba(13, 26, 33, 0.8);
            border: 1px solid rgba(0, 243, 255, 0.3);
            border-radius: 10px;
            padding: 25px;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .project-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, #00f3ff, #39ff14);
            animation: scan 3s linear infinite;
        }

        .project-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 243, 255, 0.3);
            border-color: #00f3ff;
        }

        .project-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .project-name {
            font-size: 1.3rem;
            font-weight: 700;
            color: #00f3ff;
        }

        .project-status {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 700;
        }

        .status-active {
            background: rgba(57, 255, 20, 0.2);
            color: #39ff14;
            border: 1px solid #39ff14;
        }

        .status-inactive {
            background: rgba(255, 0, 128, 0.2);
            color: #ff0080;
            border: 1px solid #ff0080;
        }

        .project-details {
            margin-bottom: 20px;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 0.9rem;
        }

        .detail-label {
            color: #888;
        }

        .detail-value {
            color: #e0e0e0;
            font-weight: 700;
        }

        .price-display {
            font-size: 1.5rem;
            font-weight: 900;
            color: #39ff14;
            margin-bottom: 20px;
            text-align: center;
        }

        .action-buttons {
            display: flex;
            gap: 10px;
        }

        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 5px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Orbitron', monospace;
            text-transform: uppercase;
            font-size: 0.8rem;
        }

        .btn-primary {
            background: linear-gradient(45deg, #00f3ff, #0080ff);
            color: #05070a;
            clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 50%, calc(100% - 10px) 100%, 0 100%, 10px 50%);
        }

        .btn-secondary {
            background: rgba(0, 243, 255, 0.1);
            color: #00f3ff;
            border: 1px solid #00f3ff;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 243, 255, 0.4);
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        @keyframes glitch {
            0%, 100% { text-shadow: 0 0 20px rgba(0, 243, 255, 0.5), 0 0 40px rgba(0, 243, 255, 0.3); }
            25% { text-shadow: -2px 0 #ff0080, 2px 0 #00f3ff; }
            50% { text-shadow: 2px 0 #ff0080, -2px 0 #00f3ff; }
            75% { text-shadow: 0 0 20px rgba(0, 243, 255, 0.5), 0 0 40px rgba(0, 243, 255, 0.3); }
        }

        @keyframes scan {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        .footer {
            background: rgba(13, 26, 33, 0.9);
            border-top: 2px solid #00f3ff;
            padding: 20px;
            text-align: center;
            color: #888;
        }

        .links {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 10px;
        }

        .link {
            color: #00f3ff;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .link:hover {
            color: #39ff14;
            text-shadow: 0 0 10px rgba(57, 255, 20, 0.5);
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">Y<span>FLOW</span></div>
        <div class="subtitle" id="subtitle">CYBERNETIC AUTOMATION PLATFORM</div>
        <div class="language-selector">
            <button class="lang-btn active" onclick="changeLanguage('en')">EN</button>
            <button class="lang-btn" onclick="changeLanguage('ar')">AR</button>
            <button class="lang-btn" onclick="changeLanguage('ru')">RU</button>
            <button class="lang-btn" onclick="changeLanguage('zh')">ZH</button>
        </div>

        <div class="trial-info" id="trialInfo">
            <div class="trial-badge" onclick="activateTrial()" style="cursor: pointer;">🎯 FREE TRIAL: 10 POINTS/MONTH</div>
            <div class="trial-desc" id="trialDesc">Try any workflow with 10 free points every month!</div>
        </div>
    </div>

    <div class="main-content">
        <div class="projects-grid" id="projectsGrid">
            <!-- Projects will be dynamically loaded here -->
        </div>
    </div>

    <div class="footer">
        <div id="footerText">Yflow © 2024 - Open Source Automation Platform</div>
        <div class="links">
            <a href="https://github.com/ahmedezzat-aejb/Yflow" class="link" target="_blank">GitHub</a>
            <a href="https://gitlab.com/ahmedezzat-aejb/yflow" class="link" target="_blank">GitLab</a>
            <a href="https://github.com/ahmedezzat-aejb/Yflow/blob/initial-setup/PROJECT_DETAILS_RU.md" class="link" target="_blank">Documentation</a>
        </div>
    </div>

    <script>
        const translations = {
            en: {
                subtitle: "CYBERNETIC AUTOMATION PLATFORM",
                footerText: "Yflow © 2024 - Open Source Automation Platform",
                trialBadge: "🎯 FREE TRIAL: 10 POINTS/MONTH",
                trialDesc: "Try any workflow with 10 free points every month!",
                projects: [
                    { name: "Neural Flow", status: "active", flows: 42, executions: 15847, price: "$49.99/month" },
                    { name: "Quantum Process", status: "active", flows: 28, executions: 8921, price: "$39.99/month" },
                    { name: "Cyber Pipeline", status: "active", flows: 35, executions: 8921, price: "$44.99/month" },
                    { name: "Digital Matrix", status: "active", flows: 67, executions: 25432, price: "$79.99/month" }
                ]
            },
            ar: {
                subtitle: "منصة الأتمتة السيبرانية",
                footerText: "Yflow © 2024 - منصة الأتمتة مفتوحة المصدر",
                trialBadge: "🎯 تجربة مجانية: 10 نقاط/شهر",
                trialDesc: "جرب أي سير عمل مع 10 نقاط مجانية كل شهر!",
                projects: [
                    { name: "التدفق العصبي", status: "active", flows: 42, executions: 15847, price: "199.96 ريال/شهر" },
                    { name: "عملية الكم", status: "active", flows: 28, executions: 8921, price: "159.96 ريال/شهر" },
                    { name: "خط الأنابيب السيبراني", status: "active", flows: 35, executions: 8921, price: "179.96 ريال/شهر" },
                    { name: "المصفوفة الرقمية", status: "active", flows: 67, executions: 25432, price: "319.96 ريال/شهر" }
                ]
            },
            ru: {
                subtitle: "КИБЕРНЕТИЧЕСКАЯ ПЛАТФОРМА АВТОМАТИЗАЦИИ",
                footerText: "Yflow © 2024 - Платформа автоматизации с открытым исходным кодом",
                trialBadge: "🎯 БЕСПЛАТНАЯ ПРОБКА: 10 ОЧКОВ/МЕСЯЦ",
                trialDesc: "Попробуйте любой рабочий процесс с 10 бесплатными очками каждый месяц!",
                projects: [
                    { name: "Нейронный Поток", status: "active", flows: 42, executions: 15847, price: "4999 ₽/месяц" },
                    { name: "Квантовый Процесс", status: "active", flows: 28, executions: 8921, price: "3999 ₽/месяц" },
                    { name: "Кибер Трубопровод", status: "active", flows: 35, executions: 8921, price: "4499 ₽/месяц" },
                    { name: "Цифровая Матрица", status: "active", flows: 67, executions: 25432, price: "7999 ₽/месяц" }
                ]
            },
            zh: {
                subtitle: "网络自动化平台",
                footerText: "Yflow © 2024 - 开源自动化平台",
                trialBadge: "🎯 免费试用：每月10积分",
                trialDesc: "每月10个免费积分试用任何工作流程！",
                projects: [
                    { name: "神经流", status: "active", flows: 42, executions: 15847, price: "349元/月" },
                    { name: "量子过程", status: "active", flows: 28, executions: 8921, price: "279元/月" },
                    { name: "网络管道", status: "active", flows: 35, executions: 8921, price: "314元/月" },
                    { name: "数字矩阵", status: "active", flows: 67, executions: 25432, price: "559元/月" }
                ]
            }
        };

        let currentLanguage = 'en';

        function changeLanguage(lang) {
            currentLanguage = lang;

            // Update button states
            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');

            // Update content
            updateContent();
        }

        function updateContent() {
            const lang = translations[currentLanguage];

            document.getElementById('subtitle').textContent = lang.subtitle;
            document.getElementById('footerText').textContent = lang.footerText;
            document.getElementById('trialBadge').textContent = lang.trialBadge;
            document.getElementById('trialDesc').textContent = lang.trialDesc;

            // Make trial badge clickable
            document.getElementById('trialBadge').onclick = activateTrial;
            document.getElementById('trialBadge').style.cursor = 'pointer';

            const projectsGrid = document.getElementById('projectsGrid');
            projectsGrid.innerHTML = '';

            lang.projects.forEach(project => {
                const card = createProjectCard(project);
                projectsGrid.appendChild(card);
            });
        }

        function createProjectCard(project) {
            const card = document.createElement('div');
            card.className = 'project-card';

            const statusClass = project.status === 'active' ? 'status-active' : 'status-inactive';
            const statusText = project.status === 'active' ? 'ACTIVE' : 'INACTIVE';

            card.innerHTML = `
                <div class="project-header">
                    <div class="project-name">${project.name}</div>
                    <div class="project-status ${statusClass}">${statusText}</div>
                </div>
                <div class="project-details">
                    <div class="detail-row">
                        <span class="detail-label">Flows:</span>
                        <span class="detail-value">${project.flows}</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Executions:</span>
                        <span class="detail-value">${project.executions.toLocaleString()}</span>
                    </div>
                </div>
                <div class="price-display">${project.price}</div>
                <div class="action-buttons">
                    <button class="btn btn-primary" onclick="handleAction('upgrade', '${project.name}')">Upgrade</button>
                    <button class="btn btn-secondary" onclick="handleAction('configure', '${project.name}')">Configure</button>
                </div>
            `;

            return card;
        }

        function handleAction(action, projectName) {
            const messages = {
                upgrade: {
                    en: `🚀 Ready to upgrade ${projectName}?\n\nWith your 10 free trial points, you can:\n• Test all workflows\n• Experience full features\n• No credit card required\n\nWould you like to proceed?`,
                    ar: `🚀 هل أنت مستعد لترقية ${projectName}؟\n\nمع نقاطك التجريبية المجانية، يمكنك:\n• اختبار جميع سير العمل\n• تجربة المميزات الكاملة\n• لا حاجة لبطاقة ائتمان\n\nهل تريد المتابعة؟`,
                    ru: `🚀 Готовы обновить ${projectName}?\n\nС вашими 10 бесплатными очками вы можете:\n• Тестировать все рабочие процессы\n• Испытать все функции\n• Не требуется кредитная карта\n\nХотите продолжить?`,
                    zh: `🚀 准备升级 ${projectName}？\n\n使用您的10个免费积分，您可以：\n• 测试所有工作流程\n• 体验完整功能\n• 无需信用卡\n\n是否要继续？`
                },
                configure: {
                    en: `⚙️ Configure ${projectName}\n\nAvailable settings:\n• Workflow customization\n• Integration options\n• Performance tuning\n• Security settings\n\nOpen configuration panel?`,
                    ar: `⚙️ تكوين ${projectName}\n\nالإعدادات المتاحة:\n• تخصيص سير العمل\n• خيارات التكامل\n• ضبط الأداء\n• إعدادات الأمان\n\nفتح لوحة التكوين؟`,
                    ru: `⚙️ Настроить ${projectName}\n\nДоступные настройки:\n• Настройка рабочих процессов\n• Варианты интеграции\n• Настройка производительности\n• Настройки безопасности\n\nОткрыть панель настроек?`,
                    zh: `⚙️ 配置 ${projectName}\n\n可用设置：\n• 工作流程自定义\n• 集成选项\n• 性能调优\n• 安全设置\n\n打开配置面板？`
                }
            };

            const message = messages[action][currentLanguage];
            alert(message);
        }

        function activateTrial() {
            const messages = {
                en: `🎯 FREE TRIAL ACTIVATED!\n\nYou now have 10 points to use:\n• Test any workflow\n• Experience full features\n• No credit card required\n• Points renew every month\n\nEnjoy your Yflow experience!`,
                ar: `🎯 تم تفعيل التجربة المجانية!\n\nلديك الآن 10 نقاط للاستخدام:\n• اختبر أي سير عمل\n• جرب المميزات الكاملة\n• لا حاجة لبطاقة ائتمان\n• النقاط تتجدد كل شهر\n\nاستمتع بتجربة Yflow!`,
                ru: `🎯 БЕСПЛАТНАЯ ПРОБКА АКТИВИРОВАНА!\n\nУ вас теперь есть 10 очков для использования:\n• Тестируйте любые рабочие процессы\n• Испытывайте все функции\n• Не требуется кредитная карта\n• Очки обновляются каждый месяц\n\nНаслаждайтесь Yflow!`,
                zh: `🎯 免费试用已激活！\n\n您现在有10个积分可使用：\n• 测试任何工作流程\n• 体验完整功能\n• 无需信用卡\n• 积分每月续期\n\n享受Yflow体验！`
            };

            alert(messages[currentLanguage]);
        }

        // Initialize with English
        updateContent();
    </script>
</body>
</html>

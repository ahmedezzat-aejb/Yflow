<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#00f3ff" />
    <meta name="description" content="Yflow - Cybernetic Automation Platform" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">

    <title>Yflow - Cybernetic Automation</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            width: 100%;
            margin: 0;
            padding: 0;
            background: #05070a;
            color: #e0e0e0;
            font-family: 'Orbitron', monospace;
            overflow-x: hidden;
        }

        #root {
            width: 100%;
            height: 100vh;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Loading screen */
        .loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #05070a;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }

        .loading-content {
            text-align: center;
        }

        .loading-logo {
            font-size: 3rem;
            font-weight: 900;
            letter-spacing: 10px;
            margin-bottom: 20px;
            animation: glitch 2s infinite;
        }

        .loading-logo span {
            color: #00f3ff;
            text-shadow: 0 0 20px #00f3ff;
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 3px solid #1f2937;
            border-top: 3px solid #00f3ff;
            border-radius: 50%;
            margin: 0 auto;
            animation: spin 1s linear infinite;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.3);
        }

        @keyframes glitch {
            0%, 100% { text-shadow: 0 0 20px rgba(0, 243, 255, 0.5), 0 0 40px rgba(0, 243, 255, 0.3); }
            25% { text-shadow: -2px 0 #ff0080, 2px 0 #00f3ff; }
            50% { text-shadow: 2px 0 #ff0080, -2px 0 #00f3ff; }
            75% { text-shadow: 0 0 20px rgba(0, 243, 255, 0.5), 0 0 40px rgba(0, 243, 255, 0.3); }
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <noscript>You need to enable JavaScript to run this app.</noscript>

    <!-- Loading Screen -->
    <div class="loading-screen" id="loading-screen">
        <div class="loading-content">
            <div class="loading-logo">Y<span>FLOW</span></div>
            <div class="loading-spinner"></div>
        </div>
    </div>

    <!-- React App Root -->
    <div id="root"></div>

    <script>
        // Hide loading screen when app is ready
        window.addEventListener('load', function() {
            setTimeout(function() {
                const loadingScreen = document.getElementById('loading-screen');
                if (loadingScreen) {
                    loadingScreen.style.opacity = '0';
                    setTimeout(function() {
                        loadingScreen.style.display = 'none';
                    }, 500);
                }
            }, 1000);
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yflow - Automation Studio</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0a0a0a;
            color: #ffffff;
            overflow-x: hidden;
        }

        /* Animated Background */
        .cyber-grid {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(0, 255, 255, 0.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 255, 0.1) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: grid-move 20s linear infinite;
            z-index: -2;
        }

        @keyframes grid-move {
            0% { transform: translate(0, 0); }
            100% { transform: translate(50px, 50px); }
        }

        .gradient-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 20% 50%, rgba(120, 0, 255, 0.3), transparent 50%),
                        radial-gradient(circle at 80% 50%, rgba(0, 255, 255, 0.3), transparent 50%),
                        radial-gradient(circle at 50% 100%, rgba(255, 0, 120, 0.2), transparent 50%);
            z-index: -1;
        }

        /* Header */
        header {
            background: rgba(20, 20, 30, 0.9);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(0, 255, 255, 0.3);
            padding: 1rem 2rem;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .header-content {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 2rem;
            font-weight: bold;
            background: linear-gradient(45deg, #00ffff, #ff00ff, #00ff00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 30px rgba(0, 255, 255, 0.5);
            animation: glow 2s ease-in-out infinite alternate;
        }

        @keyframes glow {
            from { filter: brightness(1) drop-shadow(0 0 20px rgba(0, 255, 255, 0.5)); }
            to { filter: brightness(1.2) drop-shadow(0 0 30px rgba(255, 0, 255, 0.8)); }
        }

        .header-actions {
            display: flex;
            gap: 1rem;
        }

        .btn {
            background: rgba(0, 255, 255, 0.1);
            border: 1px solid rgba(0, 255, 255, 0.3);
            color: #00ffff;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn:hover {
            background: rgba(0, 255, 255, 0.2);
            border-color: #00ffff;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.5);
            transform: translateY(-2px);
        }

        .btn-primary {
            background: linear-gradient(45deg, #00ffff, #0080ff);
            color: #0a0a0a;
            border: none;
        }

        .btn-primary:hover {
            box-shadow: 0 5px 20px rgba(0, 255, 255, 0.6);
        }

        /* Main Container */
        .container {
            max-width: 1400px;
            margin: 2rem auto;
            padding: 0 2rem;
            display: grid;
            grid-template-columns: 300px 1fr 350px;
            gap: 2rem;
            min-height: calc(100vh - 120px);
        }

        /* Sidebar */
        .sidebar {
            background: rgba(30, 30, 40, 0.8);
            border: 1px solid rgba(0, 255, 255, 0.2);
            border-radius: 12px;
            padding: 1.5rem;
            backdrop-filter: blur(10px);
            height: fit-content;
            position: sticky;
            top: 100px;
        }

        .sidebar h3 {
            color: #00ffff;
            margin-bottom: 1rem;
            font-size: 1.1rem;
        }

        .component-list {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .component-item {
            background: rgba(20, 20, 30, 0.6);
            border: 1px solid rgba(0, 255, 255, 0.1);
            border-radius: 8px;
            padding: 1rem;
            cursor: move;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .component-item:hover {
            border-color: rgba(0, 255, 255, 0.3);
            background: rgba(30, 30, 40, 0.8);
            transform: translateX(5px);
        }

        .component-icon {
            color: #00ffff;
            font-size: 1.2rem;
        }

        .component-name {
            font-size: 0.9rem;
            font-weight: 500;
        }

        /* Workflow Canvas */
        .workflow-canvas {
            background: rgba(30, 30, 40, 0.8);
            border: 1px solid rgba(0, 255, 255, 0.2);
            border-radius: 12px;
            padding: 2rem;
            backdrop-filter: blur(10px);
            position: relative;
            min-height: 600px;
        }

        .canvas-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid rgba(0, 255, 255, 0.2);
        }

        .canvas-title {
            font-size: 1.5rem;
            color: #00ffff;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .canvas-actions {
            display: flex;
            gap: 0.5rem;
        }

        .workflow-area {
            min-height: 500px;
            background: rgba(20, 20, 30, 0.4);
            border: 2px dashed rgba(0, 255, 255, 0.2);
            border-radius: 8px;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem;
        }

        .workflow-node {
            background: rgba(40, 40, 50, 0.9);
            border: 2px solid #00ffff;
            border-radius: 12px;
            padding: 1.5rem;
            margin: 1rem;
            min-width: 250px;
            position: relative;
            cursor: move;
            transition: all 0.3s ease;
        }

        .workflow-node:hover {
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.5);
            transform: translateY(-2px);
        }

        .node-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .node-title {
            font-weight: bold;
            color: #00ffff;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .node-actions {
            display: flex;
            gap: 0.5rem;
        }

        .node-action {
            background: rgba(0, 255, 255, 0.1);
            border: 1px solid rgba(0, 255, 255, 0.3);
            color: #00ffff;
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: all 0.3s ease;
        }

        .node-action:hover {
            background: rgba(0, 255, 255, 0.2);
        }

        .node-content {
            color: #ccc;
            font-size: 0.9rem;
            line-height: 1.4;
        }

        .node-connector {
            position: absolute;
            width: 20px;
            height: 20px;
            background: #00ffff;
            border: 3px solid #0a0a0a;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .node-connector:hover {
            transform: scale(1.2);
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.8);
        }

        .connector-input {
            top: 50%;
            left: -10px;
            transform: translateY(-50%);
        }

        .connector-output {
            top: 50%;
            right: -10px;
            transform: translateY(-50%);
        }

        .workflow-connection {
            position: absolute;
            height: 2px;
            background: linear-gradient(90deg, #00ffff, #ff00ff);
            z-index: 1;
            pointer-events: none;
        }

        /* Properties Panel */
        .properties-panel {
            background: rgba(30, 30, 40, 0.8);
            border: 1px solid rgba(0, 255, 255, 0.2);
            border-radius: 12px;
            padding: 1.5rem;
            backdrop-filter: blur(10px);
            height: fit-content;
            position: sticky;
            top: 100px;
        }

        .properties-panel h3 {
            color: #00ffff;
            margin-bottom: 1rem;
            font-size: 1.1rem;
        }

        .property-group {
            margin-bottom: 1.5rem;
        }

        .property-label {
            color: #888;
            font-size: 0.9rem;
            margin-bottom: 0.5rem;
            display: block;
        }

        .property-input {
            width: 100%;
            background: rgba(20, 20, 30, 0.6);
            border: 1px solid rgba(0, 255, 255, 0.2);
            border-radius: 6px;
            padding: 0.75rem;
            color: #fff;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }

        .property-input:focus {
            outline: none;
            border-color: #00ffff;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.3);
        }

        .property-select {
            width: 100%;
            background: rgba(20, 20, 30, 0.6);
            border: 1px solid rgba(0, 255, 255, 0.2);
            border-radius: 6px;
            padding: 0.75rem;
            color: #fff;
            font-size: 0.9rem;
            cursor: pointer;
        }

        .property-textarea {
            width: 100%;
            background: rgba(20, 20, 30, 0.6);
            border: 1px solid rgba(0, 255, 255, 0.2);
            border-radius: 6px;
            padding: 0.75rem;
            color: #fff;
            font-size: 0.9rem;
            resize: vertical;
            min-height: 100px;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            color: #888;
            padding: 4rem 2rem;
        }

        .empty-state i {
            font-size: 4rem;
            color: rgba(0, 255, 255, 0.3);
            margin-bottom: 1rem;
        }

        .empty-state h3 {
            color: #00ffff;
            margin-bottom: 0.5rem;
        }

        .empty-state p {
            margin-bottom: 2rem;
        }

        /* Responsive Design */
        @media (max-width: 1200px) {
            .container {
                grid-template-columns: 250px 1fr 300px;
                gap: 1rem;
            }
        }

        @media (max-width: 900px) {
            .container {
                grid-template-columns: 1fr;
                gap: 1rem;
            }

            .sidebar,
            .properties-panel {
                position: static;
            }
        }

        /* Animations */
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .pulse {
            animation: pulse 2s ease-in-out infinite;
        }

        /* Loading Animation */
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(0, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #00ffff;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="cyber-grid"></div>
    <div class="gradient-bg"></div>

    <header>
        <div class="header-content">
            <div class="logo">YFLOW</div>
            <div class="header-actions">
                <button class="btn" onclick="saveWorkflow()">
                    <i class="fas fa-save"></i> Save
                </button>
                <button class="btn" onclick="testWorkflow()">
                    <i class="fas fa-play"></i> Test
                </button>
                <button class="btn btn-primary" onclick="deployWorkflow()">
                    <i class="fas fa-rocket"></i> Deploy
                </button>
            </div>
        </div>
    </header>

    <main class="container">
        <!-- Components Sidebar -->
        <aside class="sidebar">
            <h3><i class="fas fa-puzzle-piece"></i> Components</h3>
            <div class="component-list">
                <div class="component-item" draggable="true" ondragstart="dragComponent(event, 'trigger')">
                    <i class="fas fa-play-circle component-icon"></i>
                    <span class="component-name">Trigger</span>
                </div>
                <div class="component-item" draggable="true" ondragstart="dragComponent(event, 'action')">
                    <i class="fas fa-cogs component-icon"></i>
                    <span class="component-name">Action</span>
                </div>
                <div class="component-item" draggable="true" ondragstart="dragComponent(event, 'condition')">
                    <i class="fas fa-code-branch component-icon"></i>
                    <span class="component-name">Condition</span>
                </div>
                <div class="component-item" draggable="true" ondragstart="dragComponent(event, 'loop')">
                    <i class="fas fa-sync component-icon"></i>
                    <span class="component-name">Loop</span>
                </div>
                <div class="component-item" draggable="true" ondragstart="dragComponent(event, 'filter')">
                    <i class="fas fa-filter component-icon"></i>
                    <span class="component-name">Filter</span>
                </div>
                <div class="component-item" draggable="true" ondragstart="dragComponent(event, 'transform')">
                    <i class="fas fa-exchange-alt component-icon"></i>
                    <span class="component-name">Transform</span>
                </div>
                <div class="component-item" draggable="true" ondragstart="dragComponent(event, 'delay')">
                    <i class="fas fa-clock component-icon"></i>
                    <span class="component-name">Delay</span>
                </div>
                <div class="component-item" draggable="true" ondragstart="dragComponent(event, 'webhook')">
                    <i class="fas fa-webhook component-icon"></i>
                    <span class="component-name">Webhook</span>
                </div>
            </div>
        </aside>

        <!-- Workflow Canvas -->
        <section class="workflow-canvas">
            <div class="canvas-header">
                <div class="canvas-title">
                    <i class="fas fa-project-diagram"></i>
                    <span id="workflowName">New Workflow</span>
                </div>
                <div class="canvas-actions">
                    <button class="btn" onclick="zoomIn()">
                        <i class="fas fa-search-plus"></i>
                    </button>
                    <button class="btn" onclick="zoomOut()">
                        <i class="fas fa-search-minus"></i>
                    </button>
                    <button class="btn" onclick="resetCanvas()">
                        <i class="fas fa-expand"></i>
                    </button>
                </div>
            </div>

            <div class="workflow-area" id="workflowArea" ondrop="dropComponent(event)" ondragover="allowDrop(event)">
                <div class="empty-state" id="emptyState">
                    <i class="fas fa-mouse-pointer"></i>
                    <h3>Start Building Your Workflow</h3>
                    <p>Drag components from the sidebar to begin creating your automation</p>
                    <button class="btn btn-primary" onclick="addTrigger()">
                        <i class="fas fa-plus"></i> Add Trigger
                    </button>
                </div>
            </div>
        </section>

        <!-- Properties Panel -->
        <aside class="properties-panel">
            <h3><i class="fas fa-sliders-h"></i> Properties</h3>
            <div id="propertiesContent">
                <div class="empty-state">
                    <i class="fas fa-mouse-pointer"></i>
                    <p>Select a node to configure its properties</p>
                </div>
            </div>
        </aside>
    </main>

    <script>
        // Global state
        let workflowNodes = [];
        let selectedNode = null;
        let draggedComponent = null;
        let nodeIdCounter = 1;
        let connections = [];

        // Component templates
        const componentTemplates = {
            trigger: {
                name: 'Email Trigger',
                icon: 'fa-envelope',
                description: 'Triggers when new email arrives',
                properties: {
                    provider: 'Gmail',
                    folder: 'Inbox',
                    filter: 'Unread'
                }
            },
            action: {
                name: 'Send Email',
                icon: 'fa-paper-plane',
                description: 'Send an email to specified recipients',
                properties: {
                    to: '',
                    subject: '',
                    body: ''
                }
            },
            condition: {
                name: 'If/Else Condition',
                icon: 'fa-code-branch',
                description: 'Branch workflow based on conditions',
                properties: {
                    condition: '',
                    truePath: '',
                    falsePath: ''
                }
            },
            loop: {
                name: 'For Each Loop',
                icon: 'fa-sync',
                description: 'Iterate over items in a list',
                properties: {
                    items: '',
                    variable: 'item'
                }
            },
            filter: {
                name: 'Data Filter',
                icon: 'fa-filter',
                description: 'Filter data based on criteria',
                properties: {
                    field: '',
                    operator: 'equals',
                    value: ''
                }
            },
            transform: {
                name: 'Data Transform',
                icon: 'fa-exchange-alt',
                description: 'Transform data format',
                properties: {
                    input: '',
                    mapping: ''
                }
            },
            delay: {
                name: 'Delay',
                icon: 'fa-clock',
                description: 'Wait for specified time',
                properties: {
                    duration: '5',
                    unit: 'minutes'
                }
            },
            webhook: {
                name: 'Webhook',
                icon: 'fa-webhook',
                description: 'Send/receive HTTP requests',
                properties: {
                    url: '',
                    method: 'POST',
                    headers: ''
                }
            }
        };

        // Drag and drop functions
        function dragComponent(event, componentType) {
            draggedComponent = componentType;
            event.dataTransfer.effectAllowed = 'copy';
        }

        function allowDrop(event) {
            event.preventDefault();
            event.dataTransfer.dropEffect = 'copy';
        }

        function dropComponent(event) {
            event.preventDefault();
            
            if (!draggedComponent) return;
            
            const workflowArea = document.getElementById('workflowArea');
            const rect = workflowArea.getBoundingClientRect();
            const x = event.clientX - rect.left;
            const y = event.clientY - rect.top;
            
            addWorkflowNode(draggedComponent, x, y);
            draggedComponent = null;
        }

        // Add workflow node
        function addWorkflowNode(componentType, x, y) {
            const template = componentTemplates[componentType];
            if (!template) return;
            
            const node = {
                id: `node_${nodeIdCounter++}`,
                type: componentType,
                ...template,
                x: x,
                y: y,
                properties: { ...template.properties }
            };
            
            workflowNodes.push(node);
            renderWorkflow();
            
            // Auto-select the new node
            selectNode(node.id);
        }

        // Add initial trigger
        function addTrigger() {
            const workflowArea = document.getElementById('workflowArea');
            const rect = workflowArea.getBoundingClientRect();
            addWorkflowNode('trigger', rect.width / 2 - 125, 50);
        }

        // Render workflow
        function renderWorkflow() {
            const workflowArea = document.getElementById('workflowArea');
            const emptyState = document.getElementById('emptyState');
            
            if (workflowNodes.length === 0) {
                emptyState.style.display = 'block';
                return;
            }
            
            emptyState.style.display = 'none';
            
            // Clear existing nodes (keep empty state)
            const existingNodes = workflowArea.querySelectorAll('.workflow-node');
            existingNodes.forEach(node => node.remove());
            
            // Render nodes
            workflowNodes.forEach(node => {
                const nodeElement = createNodeElement(node);
                workflowArea.appendChild(nodeElement);
            });
        }

        // Create node element
        function createNodeElement(node) {
            const nodeDiv = document.createElement('div');
            nodeDiv.className = 'workflow-node';
            nodeDiv.id = node.id;
            nodeDiv.style.position = 'absolute';
            nodeDiv.style.left = `${node.x}px`;
            nodeDiv.style.top = `${node.y}px`;
            nodeDiv.onclick = () => selectNode(node.id);
            
            nodeDiv.innerHTML = `
                <div class="node-connector connector-input"></div>
                <div class="node-connector connector-output"></div>
                <div class="node-header">
                    <div class="node-title">
                        <i class="fas ${node.icon}"></i>
                        ${node.name}
                    </div>
                    <div class="node-actions">
                        <button class="node-action" onclick="event.stopPropagation(); duplicateNode('${node.id}')">
                            <i class="fas fa-copy"></i>
                        </button>
                        <button class="node-action" onclick="event.stopPropagation(); deleteNode('${node.id}')">
                            <i class="fas fa-trash"></i>
                        </button>
                    </div>
                </div>
                <div class="node-content">${node.description}</div>
            `;
            
            return nodeDiv;
        }

        // Select node
        function selectNode(nodeId) {
            selectedNode = workflowNodes.find(node => node.id === nodeId);
            if (!selectedNode) return;
            
            // Update visual selection
            document.querySelectorAll('.workflow-node').forEach(node => {
                node.style.borderColor = '#00ffff';
            });
            document.getElementById(nodeId).style.borderColor = '#ff00ff';
            
            // Update properties panel
            updatePropertiesPanel(selectedNode);
        }

        // Update properties panel
        function updatePropertiesPanel(node) {
            const propertiesContent = document.getElementById('propertiesContent');
            
            let propertiesHTML = `
                <div class="property-group">
                    <label class="property-label">Node Type</label>
                    <input type="text" class="property-input" value="${node.type}" readonly>
                </div>
                <div class="property-group">
                    <label class="property-label">Name</label>
                    <input type="text" class="property-input" id="nodeName" value="${node.name}" onchange="updateNodeProperty('name', this.value)">
                </div>
                <div class="property-group">
                    <label class="property-label">Description</label>
                    <textarea class="property-textarea" id="nodeDescription" onchange="updateNodeProperty('description', this.value)">${node.description}</textarea>
                </div>
            `;
            
            // Add type-specific properties
            Object.keys(node.properties).forEach(key => {
                const value = node.properties[key];
                propertiesHTML += `
                    <div class="property-group">
                        <label class="property-label">${key.charAt(0).toUpperCase() + key.slice(1)}</label>
                        ${typeof value === 'boolean' ? 
                            `<select class="property-select" onchange="updateNodeProperty('${key}', this.value === 'true')">
                                <option value="true" ${value ? 'selected' : ''}>True</option>
                                <option value="false" ${!value ? 'selected' : ''}>False</option>
                            </select>` :
                            `<input type="text" class="property-input" value="${value}" onchange="updateNodeProperty('${key}', this.value)">`
                        }
                    </div>
                `;
            });
            
            propertiesContent.innerHTML = propertiesHTML;
        }

        // Update node property
        function updateNodeProperty(property, value) {
            if (!selectedNode) return;
            
            if (property === 'name' || property === 'description') {
                selectedNode[property] = value;
            } else {
                selectedNode.properties[property] = value;
            }
            
            renderWorkflow();
            // Re-select to maintain selection
            setTimeout(() => {
                document.getElementById(selectedNode.id).style.borderColor = '#ff00ff';
            }, 100);
        }

        // Delete node
        function deleteNode(nodeId) {
            if (!confirm('Are you sure you want to delete this node?')) return;
            
            workflowNodes = workflowNodes.filter(node => node.id !== nodeId);
            selectedNode = null;
            renderWorkflow();
            
            // Clear properties panel
            document.getElementById('propertiesContent').innerHTML = `
                <div class="empty-state">
                    <i class="fas fa-mouse-pointer"></i>
                    <p>Select a node to configure its properties</p>
                </div>
            `;
        }

        // Duplicate node
        function duplicateNode(nodeId) {
            const node = workflowNodes.find(n => n.id === nodeId);
            if (!node) return;
            
            const duplicatedNode = {
                ...node,
                id: `node_${nodeIdCounter++}`,
                x: node.x + 50,
                y: node.y + 50,
                properties: { ...node.properties }
            };
            
            workflowNodes.push(duplicatedNode);
            renderWorkflow();
            selectNode(duplicatedNode.id);
        }

        // Workflow actions
        function saveWorkflow() {
            const workflowData = {
                name: document.getElementById('workflowName').textContent,
                nodes: workflowNodes,
                connections: connections,
                timestamp: new Date().toISOString()
            };
            
            localStorage.setItem('currentWorkflow', JSON.stringify(workflowData));
            alert('Workflow saved successfully!');
        }

        function testWorkflow() {
            if (workflowNodes.length === 0) {
                alert('Please add some nodes to test the workflow');
                return;
            }
            
            alert('Testing workflow...\n\nThis would execute the workflow in test mode with sample data.');
        }

        function deployWorkflow() {
            if (workflowNodes.length === 0) {
                alert('Please create a workflow before deploying');
                return;
            }
            
            const confirmed = confirm('Are you ready to deploy this workflow to production?');
            if (confirmed) {
                alert('Workflow deployed successfully!\n\nYour automation is now live and running.');
            }
        }

        // Canvas controls
        function zoomIn() {
            alert('Zoom in - Canvas zoom feature coming soon');
        }

        function zoomOut() {
            alert('Zoom out - Canvas zoom feature coming soon');
        }

        function resetCanvas() {
            if (!confirm('Reset canvas? This will clear all nodes.')) return;
            
            workflowNodes = [];
            selectedNode = null;
            connections = [];
            nodeIdCounter = 1;
            renderWorkflow();
            
            document.getElementById('propertiesContent').innerHTML = `
                <div class="empty-state">
                    <i class="fas fa-mouse-pointer"></i>
                    <p>Select a node to configure its properties</p>
                </div>
            `;
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            renderWorkflow();
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yflow - Integration Hub</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0a0a0a;
            color: #ffffff;
            overflow-x: hidden;
        }

        /* Animated Background */
        .cyber-grid {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image:
                linear-gradient(rgba(0, 255, 255, 0.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 255, 0.1) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: grid-move 20s linear infinite;
            z-index: -2;
        }

        @keyframes grid-move {
            0% { transform: translate(0, 0); }
            100% { transform: translate(50px, 50px); }
        }

        .gradient-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 20% 50%, rgba(120, 0, 255, 0.3), transparent 50%),
                        radial-gradient(circle at 80% 50%, rgba(0, 255, 255, 0.3), transparent 50%),
                        radial-gradient(circle at 50% 100%, rgba(255, 0, 120, 0.2), transparent 50%);
            z-index: -1;
        }

        /* Header */
        .header {
            background: rgba(20, 20, 30, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(0, 255, 255, 0.3);
            padding: 1rem 2rem;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-content {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: bold;
            background: linear-gradient(45deg, #00ffff, #ff00ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header-actions {
            display: flex;
            gap: 1rem;
        }

        .btn {
            padding: 0.5rem 1rem;
            background: rgba(0, 255, 255, 0.1);
            border: 1px solid rgba(0, 255, 255, 0.3);
            border-radius: 8px;
            color: #00ffff;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.9rem;
        }

        .btn:hover {
            background: rgba(0, 255, 255, 0.2);
            border-color: #00ffff;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(0, 255, 255, 0.3);
        }

        .btn-primary {
            background: linear-gradient(45deg, #00ffff, #ff00ff);
            border: none;
            color: #0a0a0a;
            font-weight: bold;
        }

        /* Main Container */
        .container {
            max-width: 1400px;
            margin: 2rem auto;
            padding: 0 2rem;
        }

        /* Integration Hub Layout */
        .integration-hub {
            display: grid;
            grid-template-columns: 300px 1fr 350px;
            gap: 2rem;
            min-height: calc(100vh - 200px);
        }

        /* Integration Categories */
        .categories-sidebar {
            background: rgba(20, 20, 30, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 255, 255, 0.3);
            border-radius: 12px;
            padding: 1.5rem;
            height: fit-content;
            position: sticky;
            top: 100px;
        }

        .category-title {
            font-size: 1.2rem;
            color: #00ffff;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .category-list {
            list-style: none;
        }

        .category-item {
            padding: 0.8rem 1rem;
            margin-bottom: 0.5rem;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }

        .category-item:hover {
            background: rgba(0, 255, 255, 0.1);
            border-left: 3px solid #00ffff;
        }

        .category-item.active {
            background: rgba(0, 255, 255, 0.2);
            border-left: 3px solid #ff00ff;
        }

        .category-icon {
            width: 20px;
            text-align: center;
            color: #00ffff;
        }

        /* Integration Grid */
        .integrations-main {
            background: rgba(20, 20, 30, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 255, 255, 0.3);
            border-radius: 12px;
            padding: 1.5rem;
        }

        .search-bar {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .search-input {
            flex: 1;
            padding: 0.8rem 1rem;
            background: rgba(0, 255, 255, 0.1);
            border: 1px solid rgba(0, 255, 255, 0.3);
            border-radius: 8px;
            color: #ffffff;
            font-size: 1rem;
        }

        .search-input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .search-input:focus {
            outline: none;
            border-color: #00ffff;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.3);
        }

        .integrations-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1.5rem;
        }

        .integration-card {
            background: rgba(30, 30, 40, 0.8);
            border: 1px solid rgba(0, 255, 255, 0.2);
            border-radius: 12px;
            padding: 1.5rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .integration-card:hover {
            transform: translateY(-5px);
            border-color: #00ffff;
            box-shadow: 0 10px 25px rgba(0, 255, 255, 0.3);
        }

        .integration-card.connected {
            border-color: #00ff00;
            background: rgba(0, 255, 0, 0.1);
        }

        .integration-card.active {
            border-color: #ff00ff;
            box-shadow: 0 0 20px rgba(255, 0, 255, 0.4);
        }

        .integration-logo {
            width: 60px;
            height: 60px;
            margin: 0 auto 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            border-radius: 12px;
            background: rgba(0, 255, 255, 0.1);
        }

        .integration-name {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: #ffffff;
        }

        .integration-description {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 1rem;
            line-height: 1.4;
        }

        .integration-status {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            font-size: 0.8rem;
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.1);
        }

        .integration-status.connected {
            background: rgba(0, 255, 0, 0.2);
            color: #00ff00;
        }

        .integration-status.disconnected {
            background: rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.7);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: currentColor;
        }

        /* Connection Details */
        .connection-details {
            background: rgba(20, 20, 30, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 255, 255, 0.3);
            border-radius: 12px;
            padding: 1.5rem;
            height: fit-content;
            position: sticky;
            top: 100px;
        }

        .details-title {
            font-size: 1.2rem;
            color: #00ffff;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .details-content {
            color: rgba(255, 255, 255, 0.8);
            line-height: 1.6;
        }

        .connection-form {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-top: 1.5rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .form-label {
            font-size: 0.9rem;
            color: #00ffff;
        }

        .form-input {
            padding: 0.8rem;
            background: rgba(0, 255, 255, 0.1);
            border: 1px solid rgba(0, 255, 255, 0.3);
            border-radius: 8px;
            color: #ffffff;
            font-size: 0.9rem;
        }

        .form-input:focus {
            outline: none;
            border-color: #00ffff;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.3);
        }

        .connect-button {
            padding: 0.8rem;
            background: linear-gradient(45deg, #00ffff, #ff00ff);
            border: none;
            border-radius: 8px;
            color: #0a0a0a;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .connect-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 255, 255, 0.4);
        }

        .connect-button.connected {
            background: linear-gradient(45deg, #00ff00, #00aa00);
        }

        /* Loading State */
        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            color: #00ffff;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(0, 255, 255, 0.3);
            border-top: 3px solid #00ffff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Notification */
        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background: linear-gradient(45deg, #00ffff, #ff00ff);
            color: #0a0a0a;
            padding: 1rem 1.5rem;
            border-radius: 8px;
            font-weight: bold;
            z-index: 1000;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        /* Responsive Design */
        @media (max-width: 1200px) {
            .integration-hub {
                grid-template-columns: 250px 1fr;
            }
            
            .connection-details {
                display: none;
            }
        }

        @media (max-width: 768px) {
            .integration-hub {
                grid-template-columns: 1fr;
            }
            
            .categories-sidebar {
                position: static;
            }
            
            .integrations-grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            }
        }
    </style>
</head>
<body>
    <div class="cyber-grid"></div>
    <div class="gradient-bg"></div>

    <!-- Header -->
    <header class="header">
        <div class="header-content">
            <div class="logo">
                <i class="fas fa-plug"></i> Yflow Integration Hub
            </div>
            <div class="header-actions">
                <button class="btn" onclick="goBack()">
                    <i class="fas fa-arrow-left"></i> Back
                </button>
                <button class="btn btn-primary" onclick="saveConfiguration()">
                    <i class="fas fa-save"></i> Save Configuration
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <div class="container">
        <div class="integration-hub">
            <!-- Categories Sidebar -->
            <div class="categories-sidebar">
                <div class="category-title">
                    <i class="fas fa-layer-group"></i> Categories
                </div>
                <ul class="category-list">
                    <li class="category-item active" onclick="filterByCategory('all')">
                        <span class="category-icon"><i class="fas fa-th"></i></span>
                        <span>All Integrations</span>
                    </li>
                    <li class="category-item" onclick="filterByCategory('communication')">
                        <span class="category-icon"><i class="fas fa-envelope"></i></span>
                        <span>Communication</span>
                    </li>
                    <li class="category-item" onclick="filterByCategory('productivity')">
                        <span class="category-icon"><i class="fas fa-tasks"></i></span>
                        <span>Productivity</span>
                    </li>
                    <li class="category-item" onclick="filterByCategory('social')">
                        <span class="category-icon"><i class="fas fa-share-alt"></i></span>
                        <span>Social Media</span>
                    </li>
                    <li class="category-item" onclick="filterByCategory('storage')">
                        <span class="category-icon"><i class="fas fa-database"></i></span>
                        <span>Storage</span>
                    </li>
                    <li class="category-item" onclick="filterByCategory('development')">
                        <span class="category-icon"><i class="fas fa-code"></i></span>
                        <span>Development</span>
                    </li>
                    <li class="category-item" onclick="filterByCategory('analytics')">
                        <span class="category-icon"><i class="fas fa-chart-line"></i></span>
                        <span>Analytics</span>
                    </li>
                </ul>
            </div>

            <!-- Integrations Main Area -->
            <div class="integrations-main">
                <div class="search-bar">
                    <input type="text" class="search-input" placeholder="Search integrations..." onkeyup="searchIntegrations(this.value)">
                    <button class="btn" onclick="refreshIntegrations()">
                        <i class="fas fa-sync"></i> Refresh
                    </button>
                </div>

                <div class="integrations-grid" id="integrationsGrid">
                    <!-- Integration cards will be loaded here -->
                </div>
            </div>

            <!-- Connection Details -->
            <div class="connection-details" id="connectionDetails">
                <div class="details-title">
                    <i class="fas fa-info-circle"></i> Connection Details
                </div>
                <div class="details-content" id="detailsContent">
                    <p>Select an integration to view connection details and configure settings.</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Integration Data
        const integrations = [
            {
                id: 'gmail',
                name: 'Gmail',
                category: 'communication',
                description: 'Send and receive emails',
                icon: 'fab fa-google',
                color: '#ea4335',
                connected: false,
                fields: ['API Key', 'Client ID', 'Client Secret']
            },
            {
                id: 'slack',
                name: 'Slack',
                category: 'communication',
                description: 'Team messaging and collaboration',
                icon: 'fab fa-slack',
                color: '#4a154b',
                connected: true,
                fields: ['Webhook URL', 'Bot Token']
            },
            {
                id: 'discord',
                name: 'Discord',
                category: 'communication',
                description: 'Community and chat platform',
                icon: 'fab fa-discord',
                color: '#5865f2',
                connected: false,
                fields: ['Bot Token', 'Server ID']
            },
            {
                id: 'notion',
                name: 'Notion',
                category: 'productivity',
                description: 'All-in-one workspace',
                icon: 'fas fa-book',
                color: '#000000',
                connected: true,
                fields: ['Integration Token', 'Database ID']
            },
            {
                id: 'airtable',
                name: 'Airtable',
                category: 'productivity',
                description: 'Spreadsheet-database hybrid',
                icon: 'fas fa-table',
                color: '#18bfff',
                connected: false,
                fields: ['API Key', 'Base ID']
            },
            {
                id: 'trello',
                name: 'Trello',
                category: 'productivity',
                description: 'Project management tool',
                icon: 'fab fa-trello',
                color: '#0079bf',
                connected: false,
                fields: ['API Key', 'Token', 'Board ID']
            },
            {
                id: 'github',
                name: 'GitHub',
                category: 'development',
                description: 'Code hosting and version control',
                icon: 'fab fa-github',
                color: '#181717',
                connected: true,
                fields: ['Personal Access Token', 'Repository']
            },
            {
                id: 'twitter',
                name: 'Twitter',
                category: 'social',
                description: 'Social media platform',
                icon: 'fab fa-twitter',
                color: '#1da1f2',
                connected: false,
                fields: ['API Key', 'API Secret', 'Access Token']
            },
            {
                id: 'facebook',
                name: 'Facebook',
                category: 'social',
                description: 'Social networking platform',
                icon: 'fab fa-facebook',
                color: '#1877f2',
                connected: false,
                fields: ['App ID', 'App Secret', 'Page Access Token']
            },
            {
                id: 'instagram',
                name: 'Instagram',
                category: 'social',
                description: 'Photo and video sharing',
                icon: 'fab fa-instagram',
                color: '#e4405f',
                connected: false,
                fields: ['Access Token', 'Business Account ID']
            },
            {
                id: 'google-drive',
                name: 'Google Drive',
                category: 'storage',
                description: 'Cloud storage service',
                icon: 'fab fa-google-drive',
                color: '#4285f4',
                connected: true,
                fields: ['API Key', 'Folder ID']
            },
            {
                id: 'dropbox',
                name: 'Dropbox',
                category: 'storage',
                description: 'File hosting service',
                icon: 'fab fa-dropbox',
                color: '#0061ff',
                connected: false,
                fields: ['Access Token', 'App Key', 'App Secret']
            },
            {
                id: 'google-analytics',
                name: 'Google Analytics',
                category: 'analytics',
                description: 'Web analytics service',
                icon: 'fas fa-chart-bar',
                color: '#f37736',
                connected: false,
                fields: ['View ID', 'Service Account Key']
            },
            {
                id: 'mixpanel',
                name: 'Mixpanel',
                category: 'analytics',
                description: 'Product analytics',
                icon: 'fas fa-chart-pie',
                color: '#5b67f0',
                connected: false,
                fields: ['Project Token', 'Service Account']
            },
            {
                id: 'stripe',
                name: 'Stripe',
                category: 'development',
                description: 'Payment processing',
                icon: 'fab fa-stripe',
                color: '#635bff',
                connected: false,
                fields: ['Secret Key', 'Publishable Key']
            },
            {
                id: 'shopify',
                name: 'Shopify',
                category: 'development',
                description: 'E-commerce platform',
                icon: 'fab fa-shopify',
                color: '#95bf47',
                connected: false,
                fields: ['Store URL', 'Access Token']
            }
        ];

        let selectedIntegration = null;
        let currentCategory = 'all';
        let searchTerm = '';

        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            loadIntegrations();
        });

        // Load Integrations
        function loadIntegrations() {
            const grid = document.getElementById('integrationsGrid');
            const filteredIntegrations = filterIntegrations();
            
            grid.innerHTML = '';
            
            if (filteredIntegrations.length === 0) {
                grid.innerHTML = '<div class="loading"><div class="spinner"></div></div>';
                return;
            }
            
            filteredIntegrations.forEach(integration => {
                const card = createIntegrationCard(integration);
                grid.appendChild(card);
            });
        }

        // Filter Integrations
        function filterIntegrations() {
            return integrations.filter(integration => {
                const matchesCategory = currentCategory === 'all' || integration.category === currentCategory;
                const matchesSearch = integration.name.toLowerCase().includes(searchTerm.toLowerCase()) ||
                                     integration.description.toLowerCase().includes(searchTerm.toLowerCase());
                return matchesCategory && matchesSearch;
            });
        }

        // Create Integration Card
        function createIntegrationCard(integration) {
            const card = document.createElement('div');
            card.className = `integration-card ${integration.connected ? 'connected' : ''}`;
            card.onclick = () => selectIntegration(integration);
            
            card.innerHTML = `
                <div class="integration-logo" style="color: ${integration.color}; background: ${integration.color}20;">
                    <i class="${integration.icon}"></i>
                </div>
                <div class="integration-name">${integration.name}</div>
                <div class="integration-description">${integration.description}</div>
                <div class="integration-status ${integration.connected ? 'connected' : 'disconnected'}">
                    <span class="status-dot"></span>
                    ${integration.connected ? 'Connected' : 'Disconnected'}
                </div>
            `;
            
            return card;
        }

        // Select Integration
        function selectIntegration(integration) {
            selectedIntegration = integration;
            showConnectionDetails(integration);
            
            // Update active state
            document.querySelectorAll('.integration-card').forEach(card => {
                card.classList.remove('active');
            });
            event.currentTarget.classList.add('active');
        }

        // Show Connection Details
        function showConnectionDetails(integration) {
            const detailsContent = document.getElementById('detailsContent');
            
            detailsContent.innerHTML = `
                <div style="text-align: center; margin-bottom: 1rem;">
                    <div style="font-size: 3rem; color: ${integration.color}; margin-bottom: 0.5rem;">
                        <i class="${integration.icon}"></i>
                    </div>
                    <h3 style="color: #00ffff; margin-bottom: 0.5rem;">${integration.name}</h3>
                    <p style="color: rgba(255, 255, 255, 0.7);">${integration.description}</p>
                </div>
                
                <div class="connection-form">
                    ${integration.fields.map(field => `
                        <div class="form-group">
                            <label class="form-label">${field}</label>
                            <input type="text" class="form-input" placeholder="Enter ${field}" id="${field.replace(/\s+/g, '-').toLowerCase()}">
                        </div>
                    `).join('')}
                    
                    <button class="connect-button ${integration.connected ? 'connected' : ''}" onclick="toggleConnection('${integration.id}')">
                        ${integration.connected ? '<i class="fas fa-unlink"></i> Disconnect' : '<i class="fas fa-link"></i> Connect'}
                    </button>
                </div>
            `;
        }

        // Toggle Connection
        function toggleConnection(integrationId) {
            const integration = integrations.find(i => i.id === integrationId);
            if (integration) {
                integration.connected = !integration.connected;
                loadIntegrations();
                showConnectionDetails(integration);
                
                const status = integration.connected ? 'connected' : 'disconnected';
                showNotification(`${integration.name} ${status} successfully!`);
            }
        }

        // Filter by Category
        function filterByCategory(category) {
            currentCategory = category;
            
            // Update active state
            document.querySelectorAll('.category-item').forEach(item => {
                item.classList.remove('active');
            });
            event.currentTarget.classList.add('active');
            
            loadIntegrations();
        }

        // Search Integrations
        function searchIntegrations(term) {
            searchTerm = term;
            loadIntegrations();
        }

        // Refresh Integrations
        function refreshIntegrations() {
            const grid = document.getElementById('integrationsGrid');
            grid.innerHTML = '<div class="loading"><div class="spinner"></div></div>';
            
            setTimeout(() => {
                loadIntegrations();
                showNotification('Integrations refreshed successfully!');
            }, 1000);
        }

        // Go Back
        function goBack() {
            window.location.href = 'yflow-complete.html';
        }

        // Save Configuration
        function saveConfiguration() {
            const connectedIntegrations = integrations.filter(i => i.connected);
            const config = {
                integrations: connectedIntegrations,
                timestamp: new Date().toISOString()
            };
            
            localStorage.setItem('yflow_integrations', JSON.stringify(config));
            showNotification('Configuration saved successfully!');
        }

        // Show Notification
        function showNotification(message) {
            const notification = document.createElement('div');
            notification.className = 'notification';
            notification.textContent = message;
            
            document.body.appendChild(notification);
            
            setTimeout(() => {
                notification.remove();
            }, 3000);
        }
    </script>
</body>
</html>

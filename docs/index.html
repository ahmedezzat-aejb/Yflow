<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yflow - Cybernetic Automation Platform</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html, body {
            height: 100%;
            width: 100%;
            margin: 0;
            padding: 0;
            background: #05070a;
            overflow: hidden;
        }
        
        body {
            font-family: 'Orbitron', monospace;
            color: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .container {
            text-align: center;
            max-width: 800px;
            padding: 40px;
            background: rgba(13, 26, 33, 0.8);
            border: 1px solid rgba(0, 243, 255, 0.3);
            border-radius: 10px;
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.2);
        }
        
        .logo {
            font-size: 4rem;
            font-weight: 900;
            letter-spacing: 10px;
            margin-bottom: 20px;
            animation: glitch 2s infinite;
        }
        
        .logo span {
            color: #00f3ff;
            text-shadow: 0 0 20px #00f3ff;
        }
        
        .title {
            font-size: 1.5rem;
            margin-bottom: 30px;
            color: #39ff14;
        }
        
        .description {
            margin-bottom: 40px;
            line-height: 1.6;
        }
        
        .links {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        .link-btn {
            padding: 12px 24px;
            background: linear-gradient(45deg, #00f3ff, #0080ff);
            border: none;
            border-radius: 5px;
            color: #05070a;
            font-weight: 700;
            text-decoration: none;
            transition: all 0.3s ease;
            clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 50%, calc(100% - 10px) 100%, 0 100%, 10px 50%);
        }
        
        .link-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 243, 255, 0.4);
        }
        
        @keyframes glitch {
            0%, 100% { text-shadow: 0 0 20px rgba(0, 243, 255, 0.5), 0 0 40px rgba(0, 243, 255, 0.3); }
            25% { text-shadow: -2px 0 #ff0080, 2px 0 #00f3ff; }
            50% { text-shadow: 2px 0 #ff0080, -2px 0 #00f3ff; }
            75% { text-shadow: 0 0 20px rgba(0, 243, 255, 0.5), 0 0 40px rgba(0, 243, 255, 0.3); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">Y<span>FLOW</span></div>
        <div class="title">CYBERNETIC AUTOMATION PLATFORM</div>
        <div class="description">
            Open source automation platform with Cyberpunk/Futuristic design.<br>
            Multi-language support (EN/AR/RU/ZH) with responsive dashboard.
        </div>
        <div class="links">
            <a href="https://github.com/ahmedezzat-aejb/Yflow" class="link-btn">GitHub Repository</a>
            <a href="https://github.com/ahmedezzat-aejb/Yflow/issues" class="link-btn">Report Issues</a>
            <a href="https://github.com/ahmedezzat-aejb/Yflow/discussions" class="link-btn">Discussions</a>
        </div>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>مدير المشاريع - YFlow Sberbank</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-10">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-3xl font-bold text-green-700 mb-8 border-b-4 border-green-500 pb-2">💳 نظام دفع سبير بنك - YFlow</h1>

        <div id="loading" class="text-center text-xl text-gray-600">جاري جلب المشاريع من السيرفر...</div>

        <div id="project-list" class="grid gap-6"></div>
    </div>

    <script>
        const API_URL = 'http://localhost:3333/projects';

        async function loadProjects() {
            try {
                const response = await fetch(API_URL);
                const projects = await response.json();
                renderProjects(projects);
                document.getElementById('loading').classList.add('hidden');
            } catch (error) {
                document.getElementById('loading').innerHTML = "❌ السيرفر لسه بيحمل.. استنى ثواني وجرب ريفريش";
            }
        }

        // --- التعديل هنا لربط سبير بنك ---
        async function upgradeProject(id) {
            try {
                console.log("جاري طلب رابط الدفع من سبير بنك...");

                // 1. نكلم الـ Endpoint الجديد اللي عملناه في الـ Controller
                const response = await fetch(`${API_URL}/${id}/pay`);
                const data = await response.json();

                if (data.paymentUrl) {
                    alert('سيتم تحويلك الآن إلى صفحة دفع سبير بنك الآمنة 🏦');
                    // 2. توجيه المستخدم لصفحة البنك فوراً
                    window.location.href = data.paymentUrl;
                } else {
                    alert('عفواً: البنك لم يستجب. تأكد من إعدادات الـ .env');
                }
            } catch (error) {
                console.error("Error:", error);
                alert('حدث خطأ في الاتصال بالسيرفر');
            }
        }

        function renderProjects(projects) {
            const container = document.getElementById('project-list');
            container.innerHTML = projects.map(p => `
                <div class="bg-white p-6 rounded-xl shadow-md flex justify-between items-center border-r-8 ${p.plan?.title === 'Golden Plan' ? 'border-yellow-500' : 'border-green-500'}">
                    <div>
                        <h3 class="text-xl font-bold text-gray-800">${p.displayName}</h3>
                        <p class="text-sm text-gray-500">ID: ${p.id}</p>
                        <span class="inline-block mt-2 px-3 py-1 ${p.plan?.title === 'Golden Plan' ? 'bg-yellow-100 text-yellow-800' : 'bg-gray-100 text-gray-600'} rounded-full text-xs font-bold">
                            الخطة: ${p.plan ? p.plan.title : 'مجانية (Free)'}
                        </span>
                    </div>

                    ${p.plan?.title !== 'Golden Plan' ? `
                        <button onclick="upgradeProject('${p.id}')" class="bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-6 rounded-lg transition duration-300 shadow-lg">
                            دفع وترقية (Sberbank)
                        </button>
                    ` : `
                        <span class="text-yellow-600 font-bold">🌟 تم التفعيل</span>
                    `}
                </div>
            `).join('');
        }

        loadProjects();
    </script>
</body>
</html>
